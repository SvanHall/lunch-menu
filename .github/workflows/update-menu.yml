name: Update lunch menu

on:
  schedule:
    - cron: "0 7 * * 1"   # 07:00 UTC = 09:00 Sweden, Monday
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node scripts/update-menu.mjs

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add menu.json
          git diff --staged --quiet || git commit -m "Update lunch menu"
          git push
