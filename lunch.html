<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Dagens Lunch — Lund</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #faf6ee;
        --card: #ffffff;
        --ink: #2b2a28;
        --muted: #8a8378;
        --line: #e8e1d3;
        --accent: #e15a3c;
        --sage: #5b7b5d;
        --gold: #c9a227;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Inter", system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      header {
        position: sticky;
        top: 0;
        background: var(--bg);
        padding: 20px 20px 12px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-bottom: 1px solid var(--line);
        z-index: 10;
      }
      header h1 {
        font-family: "Fraunces", serif;
        font-weight: 700;
        font-size: 26px;
        margin: 0;
        line-height: 1;
      }
      header .date {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
        text-transform: capitalize;
      }
      #refresh {
        border: none;
        background: var(--ink);
        color: white;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        font-size: 18px;
        cursor: pointer;
      }
      #refresh:active {
        transform: scale(0.94);
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 16px 16px 60px;
      }
      .card {
        --restaurant: #334e68;
        --restaurant-wash: #f1f5f8;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        padding: 0 20px 18px;
        margin-bottom: 16px;
      }
      .card--bricks {
        --restaurant: #334e68;
        --restaurant-wash: #f1f5f8;
      }
      .card--eatery {
        --restaurant: #176b73;
        --restaurant-wash: #edf6f6;
      }
      .card--kantin {
        --restaurant: #68456f;
        --restaurant-wash: #f5f0f6;
      }
      .restaurant-head {
        display: flex;
        align-items: center;
        gap: 11px;
        margin: 0 -20px;
        padding: 16px 20px 14px;
        background: linear-gradient(105deg, var(--restaurant-wash), var(--card));
        border-top: 4px solid var(--restaurant);
        border-bottom: 1px solid var(--line);
      }
      .restaurant-mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
        background: var(--restaurant);
        color: white;
        font-family: "Fraunces", serif;
        font-size: 16px;
        line-height: 1;
        border-radius: 8px;
      }
      .card--eatery .restaurant-mark {
        border-radius: 50%;
      }
      .card--kantin .restaurant-mark {
        border-radius: 3px;
        transform: rotate(45deg);
      }
      .card--kantin .restaurant-mark span {
        transform: rotate(-45deg);
      }
      .restaurant-head h2 {
        display: flex;
        align-items: center;
        font-family: "Fraunces", serif;
        font-size: 19px;
        margin: 0;
      }
      .restaurant-head .src {
        display: block;
        margin-top: 2px;
      }
      .card .src {
        font-size: 12px;
        color: var(--muted);
        text-decoration: none;
      }
      .today-block {
        margin-top: 14px;
      }
      .today-label {
        display: inline-block;
        background: var(--accent);
        color: white;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 6px;
        margin-bottom: 10px;
      }
      .status {
        color: var(--muted);
        font-size: 14px;
        padding: 6px 0;
      }
      .stale {
        color: var(--gold);
      }
      details {
        margin-top: 14px;
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }
      summary {
        cursor: pointer;
        font-size: 13px;
        color: var(--sage);
        font-weight: 600;
      }
      .day {
        margin-top: 14px;
      }
      .day + .day {
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }
      .day h3 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--sage);
        margin: 0 0 6px;
      }

      .dish {
        margin: 0 0 8px;
        padding: 10px 12px;
        background: var(--bg);
        border-left: 3px solid var(--sage);
        border-radius: 6px;
      }
      .dish:last-child {
        margin-bottom: 0;
      }
      .dish-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-weight: 600;
        font-size: 14.5px;
      }
      .dish-head .price {
        font-weight: 500;
        color: var(--sage);
        font-size: 13px;
        white-space: nowrap;
        margin-left: 10px;
      }
      .dish-desc {
        font-size: 14px;
        line-height: 1.5;
        color: var(--ink);
        margin: 2px 0 0;
      }
      .dish-plain {
        font-size: 14.5px;
        line-height: 1.5;
        margin: 0 0 8px;
        padding: 10px 12px;
        background: var(--bg);
        border-left: 3px solid var(--sage);
        border-radius: 6px;
      }
      .dish-plain:last-child {
        margin-bottom: 0;
      }

      .dish-pancake {
        border-left-color: var(--gold);
        background: linear-gradient(135deg, #fff9e6, #fbedc0);
        box-shadow:
          0 0 0 1px rgba(201, 162, 39, 0.35),
          0 2px 8px rgba(201, 162, 39, 0.18);
      }
      .dish-pancake .dish-head {
        color: #7a5c14;
      }

      .error a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Dagens Lunch</h1>
        <div class="date" id="today-date"></div>
      </div>
      <button id="refresh" aria-label="Uppdatera">&#8635;</button>
    </header>

    <main id="cards"></main>

    <script>
      // menu.json is written once a day by a GitHub Action (see
      // scripts/update-menu.mjs) that fetches and parses all three sites
      // server-side. Because that happens outside a browser, there's no CORS
      // involved at all -- this page only ever fetches its own origin.
      const MENU_URL = "./menu.json";
      const RESTAURANT_ORDER = ["bricks", "eatery", "kantin"];
      const DAYS = ["Måndag", "Tisdag", "Onsdag", "Torsdag", "Fredag"];

      function todayName() {
        const jsDay = new Date().getDay(); // 0 = Sunday
        return jsDay >= 1 && jsDay <= 5 ? DAYS[jsDay - 1] : null;
      }

      // Eatery Lund always has a bonus alternative on top of the usual three
      // dishes on some days -- pancakes on Thursday, something sweet on
      // Tuesday. The restaurant tweaks the wording now and then, so we only
      // anchor on the "Pancake Thursday" heading itself to decide whether to
      // gold-highlight the row.
      function isPancakeThursday(text) {
        return /pancake\s+thursday/i.test(text);
      }

      function dishesHtml(dishes) {
        const normalized = [];
        for (let i = 0; i < dishes.length; i++) {
          const label = dishes[i];
          const next = dishes[i + 1];
          const price = next?.desc?.match(
            /^(\d{2,3}:-\s*(?:ink\.?\s*Kaffe\.?)?)(?:\s+(.+))$/,
          );
          if (!label.label && !label.price && label.desc && price) {
            normalized.push({ label: label.desc, price: price[1], desc: price[2] });
            i++;
          } else {
            normalized.push(label);
          }
        }

        return normalized
          .map((d) => {
            const storedDish = d.price?.match(
              /^(\d{2,3}:-\s*(?:ink\.?\s*Kaffe\.?)?)\s+(.+)$/,
            );
            const dish = !d.desc && storedDish
              ? { ...d, price: storedDish[1], desc: storedDish[2] }
              : d;
            const goldClass = isPancakeThursday(dish.desc) ? " dish-pancake" : "";
            if (!dish.label)
              return `<p class="dish-plain${goldClass}">${dish.desc}</p>`;
            return `
      <div class="dish${goldClass}">
        <div class="dish-head"><span>${dish.label}</span><span class="price">${dish.price}</span></div>
        ${dish.desc ? `<p class="dish-desc">${dish.desc}</p>` : ""}
      </div>`;
          })
          .join("");
      }

      function renderCard(r, id) {
        const el = document.createElement("div");
        el.className = `card card--${id}`;
        el.innerHTML = `
    <div class="restaurant-head">
      <span class="restaurant-mark"><span>${id[0].toUpperCase()}</span></span>
      <div><h2>${r.name}</h2>
      <a class="src" href="${r.page}" target="_blank" rel="noopener">${r.page}</a></div>
    </div>
    <div class="today-block"></div>
  `;

        const today = todayName();
        const block = el.querySelector(".today-block");
        const days = r.days || {};

        if (Object.keys(days).length === 0) {
          block.innerHTML = `<p class="status error">Ingen meny tillgänglig just nu.
      <a href="${r.page}" target="_blank" rel="noopener">Öppna sidan</a> istället.</p>`;
          return el;
        }

        if (today && days[today]) {
          block.innerHTML =
            `<span class="today-label">${today}</span>` + dishesHtml(days[today]);
        } else if (!today) {
          block.innerHTML = `<p class="status">Stängt i helgen — här är veckans meny.</p>`;
        } else {
          block.innerHTML = `<p class="status">Ingen meny hittad för idag.</p>`;
        }

        const todayIndex = DAYS.indexOf(today);
        const rest = DAYS.filter((d, i) => days[d] && (todayIndex === -1 || i > todayIndex));

        if (rest.length) {
          const details = document.createElement("details");
          details.open = !today;
          details.innerHTML = `<summary>Hela veckan</summary>`;
          rest.forEach((d) => {
            const dayEl = document.createElement("div");
            dayEl.className = "day";
            dayEl.innerHTML = `<h3>${d}</h3>` + dishesHtml(days[d]);
            details.appendChild(dayEl);
          });
          el.appendChild(details);
        }

        // updatedAt is missing only for the placeholder seed file, and older
        // than a couple of days means the daily Action itself has stopped
        // running -- both are worth a visible nudge rather than failing silently.
        const staleAfterMs = 2 * 24 * 60 * 60 * 1000;
        const isStale = !r.updatedAt || Date.now() - new Date(r.updatedAt) > staleAfterMs;
        if (isStale) {
          const notice = document.createElement("p");
          notice.className = "status stale";
          notice.textContent = r.updatedAt
            ? `Menyn uppdaterades senast ${new Date(r.updatedAt).toLocaleDateString("sv-SE")}.`
            : "Menyn har inte hämtats ännu.";
          el.appendChild(notice);
        }

        return el;
      }

      async function loadAll() {
        const container = document.getElementById("cards");
        container.innerHTML = `<p class="status">Laddar meny…</p>`;

        let data;
        try {
          const res = await fetch(MENU_URL, { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          data = await res.json();
        } catch (e) {
          container.innerHTML = `<p class="status error">Kunde inte läsa menyn (${e.message}).</p>`;
          return;
        }

        container.innerHTML = "";
        RESTAURANT_ORDER.forEach((id) => {
          const r = data.restaurants[id];
          if (r) container.appendChild(renderCard(r, id));
        });
      }

      document.getElementById("today-date").textContent =
        new Date().toLocaleDateString("sv-SE", {
          weekday: "long",
          day: "numeric",
          month: "long",
        });

      document.getElementById("refresh").addEventListener("click", loadAll);
      loadAll();
    </script>
  </body>
</html>
